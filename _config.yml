# GitHub Pages Jekyll Config
theme: jekyll-theme-minima

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax

plugins:
  - jekyll-mathjax

mathjax:
  src: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  options:
    tex:
      inlineMath:
        - ["\\(", "\\)"]
        - ["$", "$"]
      displayMath:
        - ["\\[", "\\]"]
        - ["$$", "$$"]